[project]
name = "pg-mcp-gateway"
version = "0.1.0"
description = "Stdio MCP gateway that signs in to remote OAuth MCP servers from inside the session (built for Claude Code cloud sessions)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pg-mcp-gateway = "pg_mcp_gateway:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
